<!doctype html>
<!-- PROTOTYPE, throwaway. Design directions for the "Prototype: design direction" ticket (#17). Not production.
     Three looks for the home and Projects pages, switchable via ?v=A|B|C and ?page=home|projects.
     Uses the real tokens (logo/tokens/tokens.css) and Lockup SVGs. Photos are tinted placeholders; aspect ratio and placement are the point. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design direction prototype</title>
<link rel="icon" href="logo/png/favicon.svg">
<link rel="stylesheet" href="logo/tokens/tokens.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:var(--color-bg); color:var(--color-text); font:var(--weight-regular) var(--text-body)/1.6 var(--font-brand); padding-bottom:96px; }
  img { display:block; max-width:100%; }
  [id] { scroll-margin-top:16px; }
  a { color:var(--color-link); }
  h1,h2,h3,h4 { font-weight:var(--weight-medium); margin:0; }
  p { margin:0; }
  .label { font-size:var(--text-label); font-weight:var(--weight-semibold); letter-spacing:.06em; text-transform:uppercase; }
  .muted { color:var(--color-text-muted); }
  .wrap { max-width:1240px; margin:0 auto; padding:0 16px; }
  @media (min-width:720px) { .wrap { padding:0 40px; } }
  .btn { display:inline-block; background:var(--color-action-bg); color:var(--color-action-text); padding:12px 22px; font-weight:var(--weight-semibold); font-size:var(--text-small); text-decoration:none; }

  /* Photo placeholder: a tinted block with a caption. Ratio and placement are what's being judged. */
  .ph { position:relative; aspect-ratio:var(--r,3/2); background:
        linear-gradient(160deg, color-mix(in srgb, var(--t) 70%, #fff) 0%, var(--t) 55%, color-mix(in srgb, var(--t) 60%, #000) 100%); overflow:hidden; }
  .ph::before { content:""; position:absolute; inset:0; background:
        linear-gradient(transparent 62%, rgba(0,0,0,.12) 62%), /* ground line */
        linear-gradient(90deg, transparent 30%, rgba(255,255,255,.18) 30% 58%, transparent 58%); /* a facade */ }
  .ph span { position:absolute; left:10px; bottom:8px; font-size:11px; color:rgba(255,255,255,.85); letter-spacing:.04em; }

  /* ---------- A. Gallery: photo-led, quiet, low density ---------- */
  .vA header { display:flex; justify-content:space-between; align-items:center; padding:28px 0; }
  .vA header img { height:40px; }
  .vA nav.site { display:flex; gap:28px; font-size:var(--text-small); }
  .vA nav.site a { text-decoration:none; }
  .vA nav.site a[aria-current] { text-decoration:underline; text-underline-offset:6px; }
  .vA .hero .ph { --r:21/9; }
  .vA .hero-cap { display:flex; justify-content:space-between; gap:16px; padding:14px 0 0; font-size:var(--text-small); }
  .vA .intro { max-width:30ch; font-size:var(--text-h3); font-weight:var(--weight-light); line-height:1.3; margin:120px 0; }
  .vA .feature { display:grid; gap:20px; margin-bottom:120px; }
  .vA .feature h3 { font-size:var(--text-h4); }
  .vA .pair { display:grid; gap:24px; margin-bottom:120px; }
  @media (min-width:860px) {
    .vA .feature { grid-template-columns:8fr 4fr; align-items:end; }
    .vA .pair { grid-template-columns:5fr 7fr; align-items:start; }
    .vA .pair > :first-child { margin-top:160px; }
  }
  .vA .split { display:grid; gap:48px; border-top:1px solid var(--color-border); padding:64px 0; }
  @media (min-width:860px) { .vA .split { grid-template-columns:1fr 1fr; } }
  .vA .split h2 { font-size:var(--text-h4); margin-bottom:20px; }
  .vA .webinar { padding:20px 0; border-top:1px solid var(--color-border); display:flex; justify-content:space-between; gap:16px; align-items:baseline; }
  .vA blockquote { margin:0; font-size:var(--text-h4); font-weight:var(--weight-light); line-height:1.4; }
  .vA footer { border-top:1px solid var(--color-border); padding:40px 0; font-size:var(--text-small); display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .vA .ptitle { font-size:var(--text-h1); margin:64px 0 48px; }
  .vA .plist { display:grid; gap:96px; margin-bottom:96px; }
  .vA .plist .meta { display:flex; justify-content:space-between; gap:16px; padding-top:14px; }
  .vA .plist .meta h3 { font-size:var(--text-h4); }

  /* ---------- B. Index: typographic, ruled, dense ---------- */
  .vB { --rule:1px solid var(--color-border-strong); }
  .vB header { display:grid; grid-template-columns:1fr auto; align-items:center; border-bottom:var(--rule); padding:16px 0; }
  .vB header img { height:30px; }
  .vB nav.site { display:flex; gap:20px; font-size:var(--text-small); }
  .vB nav.site a { text-decoration:none; }
  .vB nav.site a[aria-current] { font-weight:var(--weight-semibold); }
  .vB .hero { display:grid; gap:24px; padding:48px 0 32px; border-bottom:var(--rule); }
  .vB .hero h1 { font-size:clamp(2.6rem, 9vw, 7.5rem); line-height:.95; letter-spacing:-.035em; }
  .vB .hero h1 em { font-style:normal; font-weight:var(--weight-light); }
  .vB .hero .side { display:grid; gap:16px; align-content:end; }
  @media (min-width:860px) { .vB .hero { grid-template-columns:9fr 3fr; } }
  .vB .sec { display:grid; gap:16px; border-bottom:var(--rule); padding:24px 0 40px; }
  @media (min-width:860px) { .vB .sec { grid-template-columns:3fr 9fr; } }
  .vB .sec > .label { padding-top:6px; }
  .vB table { width:100%; border-collapse:collapse; font-size:var(--text-small); }
  .vB th { text-align:left; font-weight:var(--weight-semibold); font-size:var(--text-label); letter-spacing:.06em; text-transform:uppercase; padding:8px 8px 8px 0; border-bottom:var(--rule); }
  .vB td { padding:14px 8px 14px 0; border-bottom:1px solid var(--color-border); vertical-align:middle; }
  .vB td.name { font-size:var(--text-h4); font-weight:var(--weight-medium); }
  .vB td.thumb { width:96px; } .vB td.thumb .ph { --r:4/3; width:88px; }
  .vB tr.row:hover td { background:var(--color-bg-subtle); }
  @media (max-width:640px) { .vB .hide-s { display:none; } .vB td.name { font-size:var(--text-body); } }
  .vB .svc { display:grid; gap:0; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .vB .svc div { border-top:1px solid var(--color-border); padding:16px 16px 16px 0; }
  .vB .svc h3 { font-size:var(--text-body); font-weight:var(--weight-semibold); margin-bottom:6px; }
  .vB .num { font-variant-numeric:tabular-nums; color:var(--color-text-muted); }
  .vB footer { padding:24px 0; font-size:var(--text-small); display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .vB .filters { display:flex; gap:8px; flex-wrap:wrap; padding:16px 0; border-bottom:var(--rule); font-size:var(--text-small); }
  .vB .filters button { font:inherit; background:none; border:1px solid var(--color-border-strong); color:inherit; padding:4px 12px; cursor:pointer; }
  .vB .filters button[aria-pressed=true] { background:var(--color-action-bg); color:var(--color-action-text); }
  .vB .pv { display:grid; gap:24px; padding:24px 0 48px; }
  @media (min-width:860px) { .vB .pv { grid-template-columns:7fr 5fr; } .vB .pv .preview { position:sticky; top:16px; align-self:start; } }

  /* ---------- C. Constructed: dark ground, geometric blocks echo the Mark ---------- */
  .vC header { display:flex; justify-content:space-between; align-items:center; padding:24px 0; }
  .vC header img { height:36px; }
  .vC nav.site { display:flex; gap:6px; font-size:var(--text-small); flex-wrap:wrap; }
  .vC nav.site a { text-decoration:none; padding:6px 14px; border-radius:999px; }
  .vC nav.site a[aria-current] { background:var(--color-bg-subtle); }
  .vC .hero { display:grid; gap:12px; margin:24px 0 12px; }
  .vC .hero .text { background:var(--color-bg-subtle); padding:32px; border-radius:0 0 0 160px; display:grid; align-content:end; gap:20px; min-height:340px; }
  .vC .hero h1 { font-size:var(--text-display); line-height:1.05; letter-spacing:-.02em; }
  .vC .hero .ph { --r:auto; min-height:340px; border-radius:0 200px 200px 0; }
  @media (min-width:860px) { .vC .hero { grid-template-columns:5fr 7fr; } .vC .hero .ph { min-height:560px; } }
  .vC .bento { display:grid; gap:12px; grid-template-columns:repeat(2,1fr); margin-bottom:12px; }
  .vC .bento .ph { --r:auto; height:100%; min-height:200px; }
  .vC .tile { background:var(--color-bg-subtle); padding:24px; display:grid; align-content:space-between; gap:16px; min-height:200px; }
  .vC .round { border-radius:50%; display:grid; place-items:center; text-align:center; padding:32px; }
  .vC .halfL { border-radius:999px 0 0 999px; }
  .vC .halfT { border-radius:999px 999px 0 0; }
  @media (min-width:860px) {
    .vC .bento { grid-template-columns:repeat(4,1fr); grid-auto-rows:240px; }
    .vC .bento .w2 { grid-column:span 2; } .vC .bento .h2 { grid-row:span 2; }
  }
  .vC .tile h3 { font-size:var(--text-h4); }
  .vC .webs { display:grid; gap:12px; margin:12px 0; }
  @media (min-width:860px) { .vC .webs { grid-template-columns:4fr 8fr; } }
  .vC .wrow { display:flex; justify-content:space-between; gap:16px; padding:16px 0; border-top:1px solid var(--color-border); align-items:center; flex-wrap:wrap; }
  .vC footer { padding:40px 0; font-size:var(--text-small); display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; color:var(--color-text-muted); }
  .vC .ptitle { display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:40px 0 24px; }
  .vC .ptitle h1 { font-size:var(--text-h1); }
  .vC .masonry { columns:1; column-gap:12px; margin-bottom:48px; }
  @media (min-width:640px) { .vC .masonry { columns:2; } }
  @media (min-width:1000px) { .vC .masonry { columns:3; } }
  .vC .masonry a { display:block; break-inside:avoid; margin-bottom:12px; text-decoration:none; background:var(--color-bg-subtle); }
  .vC .masonry .cap { padding:14px 16px; display:flex; justify-content:space-between; gap:12px; }

  /* ---------- Prototype switcher (not part of any design) ---------- */
  #proto { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:9; display:flex; align-items:center; gap:4px;
           background:#fff; color:#111; padding:6px; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.25); font:13px/1 system-ui, sans-serif; max-width:calc(100% - 32px); }
  #proto button { font:inherit; border:0; background:none; color:inherit; padding:8px 12px; border-radius:999px; cursor:pointer; }
  #proto button[aria-pressed=true] { background:#111; color:#fff; }
  #proto .lbl { padding:0 8px; white-space:nowrap; font-weight:600; }
  #proto .sep { width:1px; height:20px; background:#ddd; margin:0 4px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="proto" aria-label="Prototype switcher">
  <button id="prev" aria-label="Previous direction">←</button><span class="lbl" id="lbl"></span><button id="next" aria-label="Next direction">→</button>
  <span class="sep"></span>
  <button data-page="home">Home</button><button data-page="projects">Projects</button>
</div>
<script>
// Placeholder content. Names, places and quotes are invented for the prototype.
const P = [
  { n:'Courtyard House', loc:'Kotturpuram, Chennai', yr:2025, type:'Residence', t:'#8A7F72', r:'4/5' },
  { n:'Brick Terrace Villa', loc:'ECR, Chennai', yr:2024, type:'Residence', t:'#9B6B52', r:'3/2' },
  { n:'Two Gardens', loc:'Adyar, Chennai', yr:2024, type:'Residence', t:'#6E7F72', r:'1/1' },
  { n:'Studio on 4th Street', loc:'Besant Nagar, Chennai', yr:2023, type:'Interior', t:'#6C7A86', r:'3/4' },
  { n:'Lantern House', loc:'Anna Nagar, Chennai', yr:2023, type:'Residence', t:'#7D7468', r:'16/9' },
  { n:'Shaded Duplex', loc:'Velachery, Chennai', yr:2022, type:'Renovation', t:'#5E6A73', r:'4/5' },
];
const S = [
  ['Architecture', 'New homes, from first sketch to handover.'],
  ['Interiors', 'Spaces, joinery and light, designed with the building.'],
  ['Renovation', 'Reworking existing homes for how you live now.'],
];
const W = [
  { d:'14 Dec 2026', n:'Reading a site: climate, light and plot in Chennai', price:'₹999' },
  { d:'11 Jan 2027', n:'Portfolio review for young architects', price:'₹999' },
];
const Q = { q:'They listened for months before drawing a line. The house feels like it was always ours.', who:'Homeowner, Courtyard House' };

const ph = (p, label = 'photo', r = p.r) => `<div class="ph" style="--t:${p.t};--r:${r}"><span>${label}: ${p.n}</span></div>`;
const nav = (page) => `<nav class="site">${['Projects','Services','About','Webinars','Contact'].map(x =>
  `<a href="#" ${x === 'Projects' && page === 'projects' ? 'aria-current="page"' : ''} data-go="${x === 'Projects' ? 'projects' : ''}">${x}</a>`).join('')}</nav>`;
const logo = (dark) => `<a href="#" data-go="home"><img src="logo/svg/oda-lockup-horizontal-${dark ? 'dark' : 'light'}.svg" alt="One Dream Architecture"></a>`;

const V = {
  A: { name:'Gallery', dark:false, home: () => `
    <div class="wrap">
      <header>${logo()}${nav('home')}</header>
      <section class="hero">${ph(P[0], 'hero photo', '21/9')}
        <div class="hero-cap"><span>${P[0].n}, ${P[0].loc}</span><a href="#" data-go="projects">All projects →</a></div></section>
      <p class="intro">We design calm, contemporary homes in Chennai, shaped around light, air and the way a family lives.</p>
      <section class="feature">${ph(P[1], 'photo', '3/2')}
        <div><p class="label muted">${P[1].type} · ${P[1].yr}</p><h3>${P[1].n}</h3><p class="muted">${P[1].loc}</p></div></section>
      <section class="pair">
        <div>${ph(P[2], 'photo', '4/5')}<p style="padding-top:12px">${P[2].n} <span class="muted">· ${P[2].loc}</span></p></div>
        <div>${ph(P[4], 'photo', '4/3')}<p style="padding-top:12px">${P[4].n} <span class="muted">· ${P[4].loc}</span></p></div></section>
      <section class="split">
        <div><h2>Services</h2>${S.map(([h, d]) => `<p style="margin-bottom:16px"><b style="font-weight:500">${h}.</b> <span class="muted">${d}</span></p>`).join('')}</div>
        <div><blockquote>“${Q.q}”</blockquote><p class="muted" style="margin-top:16px">${Q.who}</p></div></section>
      <section class="split" style="grid-template-columns:1fr">
        <div><h2>Upcoming webinars</h2>${W.map(w => `<div class="webinar"><span><span class="muted">${w.d}</span> · ${w.n}</span><a href="#">Book on webinar.gg →</a></div>`).join('')}</div></section>
      <footer><span>One Dream Architecture, Chennai</span><span>hello@example.com · Instagram</span></footer>
    </div>`,
    projects: () => `
    <div class="wrap">
      <header>${logo()}${nav('projects')}</header>
      <h1 class="ptitle">Projects</h1>
      <div class="plist">${P.map((p, i) => `<a href="#" style="text-decoration:none;${i % 2 ? 'margin-left:auto;' : ''}max-width:${p.r === '16/9' || p.r === '3/2' ? '100%' : '62%'};width:100%">
        ${ph(p, 'lead photo')}<div class="meta"><h3>${p.n}</h3><span class="muted">${p.loc} · ${p.yr}</span></div></a>`).join('')}</div>
      <footer><span>One Dream Architecture, Chennai</span><span>hello@example.com · Instagram</span></footer>
    </div>` },

  B: { name:'Index', dark:false, home: () => `
    <div class="wrap">
      <header>${logo()}${nav('home')}</header>
      <section class="hero"><h1>Homes built <em>around</em> light, air <em>and</em> the people in them.</h1>
        <div class="side"><p class="muted">An architecture practice in Chennai designing contemporary houses and interiors.</p><a class="btn" href="#">Start a project</a></div></section>
      <section class="sec"><p class="label">Selected work</p><table>
        <thead><tr><th></th><th>Project</th><th class="hide-s">Location</th><th class="hide-s">Type</th><th>Year</th></tr></thead>
        <tbody>${P.slice(0, 4).map(p => `<tr class="row"><td class="thumb">${ph(p, 'photo', '4/3')}</td><td class="name">${p.n}</td><td class="hide-s muted">${p.loc}</td><td class="hide-s muted">${p.type}</td><td class="num">${p.yr}</td></tr>`).join('')}</tbody></table>
        <span></span><a href="#" data-go="projects">All ${P.length} projects →</a></section>
      <section class="sec"><p class="label">Services</p><div class="svc">${S.map(([h, d], i) => `<div><p class="num">0${i + 1}</p><h3>${h}</h3><p class="muted">${d}</p></div>`).join('')}</div></section>
      <section class="sec"><p class="label">Clients</p><div><p style="font-size:var(--text-h3);font-weight:300;line-height:1.3;max-width:28ch">“${Q.q}”</p><p class="muted" style="margin-top:12px">${Q.who}</p></div></section>
      <section class="sec"><p class="label">Webinars</p><table><tbody>${W.map(w => `<tr><td class="num" style="width:120px">${w.d}</td><td>${w.n}</td><td class="hide-s num">${w.price}</td><td style="text-align:right"><a href="#">Book →</a></td></tr>`).join('')}</tbody></table></section>
      <footer><span>One Dream Architecture · Chennai</span><span>hello@example.com · Instagram</span></footer>
    </div>`,
    projects: () => `
    <div class="wrap">
      <header>${logo()}${nav('projects')}</header>
      <section class="hero" style="padding:32px 0 24px"><h1 style="font-size:var(--text-display)">Projects <span class="num" style="font-weight:300">(${P.length})</span></h1></section>
      <div class="filters">${['All', 'Residence', 'Interior', 'Renovation'].map((f, i) => `<button aria-pressed="${!i}">${f}</button>`).join('')}</div>
      <div class="pv"><table>
        <thead><tr><th>No.</th><th>Project</th><th class="hide-s">Location</th><th class="hide-s">Type</th><th>Year</th></tr></thead>
        <tbody>${P.map((p, i) => `<tr class="row" data-i="${i}"><td class="num">${String(i + 1).padStart(2, '0')}</td><td class="name">${p.n}</td><td class="hide-s muted">${p.loc}</td><td class="hide-s muted">${p.type}</td><td class="num">${p.yr}</td></tr>`).join('')}</tbody></table>
        <div class="preview" id="pv">${ph(P[0], 'hover preview', '4/5')}</div></div>
      <footer style="border-top:var(--rule)"><span>One Dream Architecture · Chennai</span><span>hello@example.com · Instagram</span></footer>
    </div>` },

  C: { name:'Constructed', dark:true, home: () => `
    <div class="wrap">
      <header>${logo(true)}${nav('home')}</header>
      <section class="hero"><div class="text"><h1>Homes, carefully constructed.</h1><p class="muted">Contemporary houses and interiors in Chennai.</p><div><a class="btn" href="#">Start a project</a></div></div>${ph(P[1], 'hero photo', 'auto')}</section>
      <section class="bento">
        <a href="#" class="w2 h2" style="display:block">${ph(P[0], 'photo', 'auto')}</a>
        <div class="tile halfT"><p class="label muted">Services</p><div>${S.map(([h]) => `<h3>${h}</h3>`).join('')}</div></div>
        <a href="#" style="display:block">${ph(P[2], 'photo', 'auto')}</a>
        <div class="tile round"><div><p style="font-size:var(--text-h4);font-weight:300;line-height:1.35">“${Q.q.split('.')[1].trim()}.”</p><p class="muted label" style="margin-top:12px">${Q.who}</p></div></div>
        <a href="#" class="tile halfL" data-go="projects" style="text-decoration:none;padding-left:48px"><p class="label muted">Work</p><h3>All projects →</h3></a>
      </section>
      <section class="webs"><div class="tile"><p class="label muted">Webinars</p><h3>Learn with us</h3></div>
        <div class="tile" style="align-content:start">${W.map(w => `<div class="wrow"><span><span class="muted">${w.d}</span><br>${w.n}</span><a class="btn" href="#">Book · ${w.price}</a></div>`).join('')}</div></section>
      <footer><span>One Dream Architecture, Chennai</span><span>hello@example.com · Instagram</span></footer>
    </div>`,
    projects: () => `
    <div class="wrap">
      <header>${logo(true)}${nav('projects')}</header>
      <div class="ptitle"><h1>Projects</h1><p class="muted">${P.length} homes and interiors, 2022–2025</p></div>
      <div class="masonry">${P.map(p => `<a href="#">${ph(p)}<div class="cap"><span>${p.n}</span><span class="muted">${p.yr}</span></div></a>`).join('')}</div>
      <footer><span>One Dream Architecture, Chennai</span><span>hello@example.com · Instagram</span></footer>
    </div>` },

  // D: the Firm's pick. One page: B's header and hero, A's project list, C's dark ground. Nav links scroll to sections.
  D: { name:'Mix: B hero + A projects, dark', dark:true, cls:'vA vB', home: () => `
    <div class="wrap">
      <header>${logo(true)}<nav class="site">${[['Projects','projects'],['Services','services'],['About','about'],['Webinars','webinars'],['Contact','contact']].map(([x, id]) => `<a href="#${id}">${x}</a>`).join('')}</nav></header>
      <section class="hero" id="about"><h1>Homes built <em>around</em> light, air <em>and</em> the people in them.</h1>
        <div class="side"><p class="muted">An architecture practice in Chennai designing contemporary houses and interiors.</p><a class="btn" href="#contact">Start a project</a></div></section>
      <section id="projects"><h2 class="ptitle">Projects</h2>
        <div class="plist">${P.map((p, i) => `<a href="#" style="text-decoration:none;${i % 2 ? 'margin-left:auto;' : ''}max-width:${p.r === '16/9' || p.r === '3/2' ? '100%' : '62%'};width:100%">
          ${ph(p, 'lead photo')}<div class="meta"><h3>${p.n}</h3><span class="muted">${p.loc} · ${p.yr}</span></div></a>`).join('')}</div></section>
      <section class="sec" id="services" style="border-top:var(--rule)"><p class="label">Services</p><div class="svc">${S.map(([h, d], i) => `<div><p class="num">0${i + 1}</p><h3>${h}</h3><p class="muted">${d}</p></div>`).join('')}</div></section>
      <section class="sec"><p class="label">Clients</p><div><p style="font-size:var(--text-h3);font-weight:300;line-height:1.3;max-width:28ch">“${Q.q}”</p><p class="muted" style="margin-top:12px">${Q.who}</p></div></section>
      <section class="sec" id="webinars"><p class="label">Webinars</p><table><tbody>${W.map(w => `<tr><td class="num" style="width:120px">${w.d}</td><td>${w.n}</td><td class="hide-s num">${w.price}</td><td style="text-align:right"><a href="#">Book on webinar.gg →</a></td></tr>`).join('')}</tbody></table></section>
      <footer id="contact"><span>One Dream Architecture · Chennai</span><span>hello@example.com · Instagram</span></footer>
    </div>` },
};
V.D.projects = V.D.home; // one page: "Projects" just scrolls

const keys = Object.keys(V);
const q = new URLSearchParams(location.search);
let v = keys.includes(q.get('v')) ? q.get('v') : 'A';
let page = q.get('page') === 'projects' ? 'projects' : 'home';

function render() {
  const d = V[v];
  document.documentElement.dataset.theme = d.dark ? 'dark' : 'light';
  const app = document.getElementById('app');
  app.className = d.cls || 'v' + v;
  app.innerHTML = d[page]();
  document.getElementById('lbl').textContent = `${v} (${d.name})`;
  document.querySelectorAll('#proto [data-page]').forEach(b => b.setAttribute('aria-pressed', b.dataset.page === page));
  history.replaceState(null, '', `?v=${v}&page=${page}`);
  document.title = `${v} ${d.name} · ${page} · prototype`;
  const target = v === 'D' && page === 'projects' && document.getElementById('projects');
  target ? target.scrollIntoView() : scrollTo(0, 0);
}
const step = (n) => { v = keys[(keys.indexOf(v) + n + keys.length) % keys.length]; render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.addEventListener('click', e => {
  const pg = e.target.closest('[data-page]'); if (pg) { page = pg.dataset.page; render(); return; }
  const go = e.target.closest('[data-go]'); if (go && go.dataset.go) { e.preventDefault(); page = go.dataset.go; render(); return; }
  const f = e.target.closest('.vB .filters button');
  if (f) f.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === f));
  const a = e.target.closest('#app a'); if (!a) return;
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  if (id) document.getElementById(id)?.scrollIntoView({ behavior:'smooth' });
});
document.addEventListener('mouseover', e => {
  const r = e.target.closest('.vB tr.row[data-i]'); const pv = document.getElementById('pv');
  if (r && pv) pv.innerHTML = ph(P[r.dataset.i], 'hover preview', '4/5');
});
render();
</script>
</body>
</html>
